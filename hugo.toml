baseURL = 'https://junhanx.github.io/'
locale = 'zh-cn'
title = 'JunhanX Blog'
theme = 'PaperMod'

# 分页
paginate = 10

# 语法高亮
[markup]
  [markup.highlight]
    noClasses = false

[params]
  # 主页信息
  description = "Linux / 操作系统 / 虚拟化 · 记录学习与思考"
  author = "JunhanX"

  # 日期格式 — 全角括号
  DateFormat = "【2006-01-02】"

  # 默认主题模式
  defaultTheme = 'auto'
  # 首页显示模式
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  # 导航菜单 - 主要内容分区
  mainSections = ['posts']

  # 首页个人介绍
  [params.homeInfoParams]
    Title = "Hi，我是 JunhanX 👋"
    Content = "Linux 内核 / 系统编程 / 虚拟化技术 · 记录学习过程中的思考与总结"

  # 导航栏标签行
  [params.label]
    tagline = "Linux / 操作系统 / 虚拟化 · 记录学习与思考"

  # 页脚
  [params.footer]
    startYear = "2020"

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/junhanX'

[menus]
  [[menus.main]]
    name = '文章'
    pageRef = '/posts'
    weight = 10
  [[menus.main]]
    name = '标签'
    pageRef = '/tags'
    weight = 20
  [[menus.main]]
    name = '归档'
    pageRef = '/archives'
    weight = 30
  [[menus.main]]
    name = '关于'
    pageRef = '/about'
    weight = 40

# RSS
[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'
